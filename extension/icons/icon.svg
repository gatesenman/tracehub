<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d6bff"/>
      <stop offset="1" stop-color="#8a4dff"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <!-- winding trail: the path of pages you've visited -->
  <path d="M120 400 C 120 300, 240 330, 260 250 C 278 178, 190 160, 210 118"
        fill="none" stroke="url(#trail)" stroke-width="34" stroke-linecap="round"
        stroke-dasharray="0.1 68"/>
  <!-- destination star: the trace you keep -->
  <path d="M352 96 l24.5 49.6 54.7 8 -39.6 38.6 9.4 54.5 -49 -25.7 -49 25.7 9.4 -54.5 -39.6 -38.6 54.7 -8 z"
        fill="#ffd257" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
  <!-- start point -->
  <circle cx="120" cy="412" r="30" fill="#ffffff"/>
</svg>
